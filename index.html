<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Document Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Team Registration Form</h2>
    <form id="teamForm">
      <div class="form-group">
        <label>Team Name *</label>
        <input type="text" id="teamName" required>
      </div>
      <div class="form-group">
        <label>Team Leader *</label>
        <input type="text" id="teamLeader" required>
      </div>
      <button type="submit" id="submitBtn">Generate & Download PDF</button>
    </form>
  </div>

  <script>
    // Replace with your live backend API URL (e.g., on Render or Railway)
    const BACKEND_URL = 'https://your-api-service.onrender.com/generate-pdf';

    document.getElementById('teamForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      const payload = {
        teamName: document.getElementById('teamName').value.trim(),
        teamLeader: document.getElementById('teamLeader').value.trim()
      };

      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error('Failed to generate PDF');

        // Receive PDF binary blob directly
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Team_Proposal_${payload.teamName}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
